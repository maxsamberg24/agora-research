<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation — Agora Research</title>
<meta name="description" content="More ways to connect than ever. Less connection. The full research presentation.">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{height:100%;overflow:hidden}
body{background:var(--ghost)}

.nav{position:fixed;top:0;left:0;right:0}

.deck{
  height:100vh;height:100dvh;
  overflow-y:auto;overflow-x:hidden;
  scroll-snap-type:y proximity;
  
  scroll-padding-top:0;
}
.deck::-webkit-scrollbar{width:0;background:transparent}

.slide{
  height:100vh;height:100dvh;
  scroll-snap-align:center;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--navh) + 1.4rem) var(--gut) 3.2rem;
}
.slide img{
  max-width:100%;max-height:100%;
  width:auto;height:auto;object-fit:contain;
  border-radius:6px;
  box-shadow:0 18px 50px rgba(22,22,22,.13), 0 2px 8px rgba(22,22,22,.07);
  opacity:.45;transform:scale(.994);
  transition:opacity 1s cubic-bezier(.25,.6,.3,1), transform 1.1s cubic-bezier(.25,.6,.3,1);
}
.slide.in img{opacity:1;transform:none}

/* counter */
.counter{
  position:fixed;right:var(--gut);bottom:1.1rem;z-index:90;
  display:flex;align-items:center;gap:.55rem;
  padding:.45rem .85rem;border-radius:999px;
  font-size:.76rem;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--ink);
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(180%);
  -webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 5px 18px rgba(22,22,22,.12);
}
.counter .sep{color:var(--coral)}
.counter .ttl{color:var(--ink-2);font-weight:500;max-width:13rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* progress rail */
.rail{
  position:fixed;left:0;top:0;height:3px;z-index:95;
  background:var(--coral);width:0;
  transition:width .18s linear;
}

/* download */
.dl{
  position:fixed;left:var(--gut);bottom:1.1rem;z-index:90;
  padding:.5rem 1rem;font-size:.76rem;
}

/* hint on first load */
.hint{
  position:fixed;left:50%;bottom:1.35rem;transform:translateX(-50%);z-index:90;
  font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);opacity:0;
  animation:hintin .6s ease 1.1s forwards, hintout .6s ease 6s forwards;
  pointer-events:none;display:flex;align-items:center;gap:.4rem;
}
@keyframes hintin{to{opacity:.8}}
@keyframes hintout{to{opacity:0}}
.hint .chev{animation:bob 1.7s ease-in-out infinite;color:var(--coral);font-size:.9rem}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

@media (max-width:720px){
  .slide{padding:calc(var(--navh) + 2.2rem) .7rem 3.4rem}
  .counter .ttl{display:none}
  .hint{display:none}
}
</style>
</head>
<body>

<div class="rail" id="rail"></div>

<nav class="nav" aria-label="Main">
    <span class="brand"><img src="/assets/agora-mark.png" alt="Agora"></span>
    <div class="pill">
      <a href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>Home</span>
      </a>
      <a href="/research/">Research</a>
      <span class="sub">
        <a href="/research/summary/">Summary</a>
        <a href="/research/presentation/" aria-current="page">Presentation</a>
        <a href="/research/reports/">Reports</a>
      </span>
      <a href="/writing/">Writing</a>
    </div>
  </nav>

<main class="deck" id="deck" tabindex="-1"></main>

<a class="glassbtn dl" href="/assets/agora-research-presentation.pdf" download>Download PDF</a>

<div class="counter"><span id="cur">1</span><span class="sep">/</span><span>39</span><span class="ttl" id="ttl">Title</span></div>

<div class="hint"><span>Scroll</span><span class="chev">↓</span></div>

<script>
(function(){
  var TITLES = ["Title","Background","The anxious generation grew up","Not just a result of COVID","A serious health problem",
  "Drinking has collapsed, but not the bar","Solutions aim at children","Summary","The collision","The social infrastructure gap years",
  "The same wall in three cities","The research","What I set out to learn","How I gathered information","Who I talked to",
  "Insights","0 of 20","Friendships form in recurring formats","Meeting people isn't hard","Friend groups don't merge",
  "What people do instead of bars","The default is staying in","Open to new people, wary of strangers","Discovery is not the bottleneck","Apps are good at logistics, bad at people",
  "The one app that's working","Opportunities","The four core problems","The bar's product was never alcohol","The middle ground",
  "Why nothing fills the middle","The early adopters were never the problem","Nobody leaves the slide","The weekend loop","Looking ahead",
  "The lesson","The bet","Who we're building for","Close"];

  var deck = document.getElementById('deck');
  var cur = document.getElementById('cur');
  var ttl = document.getElementById('ttl');
  var rail = document.getElementById('rail');

  var pad = function(n){ return n < 10 ? '0' + n : '' + n; };

  for (var i = 1; i <= 39; i++){
    var sec = document.createElement('section');
    sec.className = 'slide';
    sec.setAttribute('data-n', i);
    var img = document.createElement('img');
    img.src = '/assets/slides/slide-' + pad(i) + '.jpg';
    img.alt = 'Slide ' + i + ' — ' + TITLES[i-1];
    img.loading = i <= 2 ? 'eager' : 'lazy';
    img.decoding = 'async';
    sec.appendChild(img);
    deck.appendChild(sec);
  }

  var slides = [].slice.call(deck.querySelectorAll('.slide'));

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.intersectionRatio > 0.35){
        en.target.classList.add('in');
        var n = parseInt(en.target.getAttribute('data-n'), 10);
        cur.textContent = n;
        ttl.textContent = TITLES[n-1];
        rail.style.width = (n / 39 * 100) + '%';
      }
    });
  }, {threshold:[0, .35, .6]});
  slides.forEach(function(s){ io.observe(s); });

  slides[0].classList.add('in');
  rail.style.width = (1/39*100) + '%';

  /* eased scroll of our own — native 'smooth' is too abrupt over a full screen */
  var animating = false;
  function glide(to){
    var start = deck.scrollTop, dist = to - start, t0 = null, dur = 850;
    if (Math.abs(dist) < 2) return;
    animating = true;
    function step(ts){
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
      deck.scrollTop = start + dist * e;
      if (p < 1) requestAnimationFrame(step); else animating = false;
    }
    requestAnimationFrame(step);
  }
  function go(dir){
    if (animating) return;
    var h = deck.clientHeight;
    var idx = Math.round(deck.scrollTop / h) + dir;
    idx = Math.max(0, Math.min(slides.length - 1, idx));
    glide(idx * h);
  }

  window.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ' || e.key === 'ArrowRight'){
      e.preventDefault(); go(1);
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'ArrowLeft'){
      e.preventDefault(); go(-1);
    } else if (e.key === 'Home'){
      e.preventDefault(); glide(0);
    } else if (e.key === 'End'){
      e.preventDefault(); glide((slides.length-1) * deck.clientHeight);
    }
  });
})();
</script>
</body>
</html>
