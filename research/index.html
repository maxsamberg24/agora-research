<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Research — Agora</title>
<meta name="description" content="Twenty conversations on how young adults connect socially — and why the bar keeps winning.">
<link rel="icon" href="/assets/agora-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{height:100%}
body{overflow:hidden;background:#F3C89B}

/* ---------- the window ---------- */
.stage{position:fixed;inset:0;overflow:hidden}
.plate{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;object-position:50% 46%;
  will-change:transform,opacity;
  user-select:none;-webkit-user-drag:none;
}

/* outer layer takes the cursor parallax, inner takes the slow ambient drift —
   two separate elements so the transforms never fight each other */
.drift{
  position:absolute;inset:0;
  will-change:transform;
  transition:transform 1.1s cubic-bezier(.18,.7,.28,1);
}
.ken{
  position:absolute;inset:0;will-change:transform;
  animation:driftscene 52s cubic-bezier(.45,0,.55,1) infinite alternate;
}
/* a slow walk out onto the terrace — the view opens, then eases back */
@keyframes driftscene{
  from{transform:scale(1)}
  to  {transform:scale(1.062)}
}

/* warm light pooling up from the horizon, and depth at the frame edge */
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:
    radial-gradient(58% 42% at 50% 40%, rgba(255,244,228,.34) 0%, rgba(255,244,228,0) 68%),
    linear-gradient(180deg, rgba(255,248,236,.18) 0%, rgba(255,248,236,0) 26%);
  box-shadow:inset 0 0 190px 56px rgba(126,78,44,.2);
}

/* ---------- content ---------- */
.content{position:relative;z-index:10;height:100%;display:flex;flex-direction:column}
.hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:calc(var(--navh) + clamp(1.5rem,6vh,4.6rem)) var(--gut) 0;text-align:center;
}
.hero .eyebrow{
  color:#2A1B10;opacity:0;letter-spacing:.26em;font-size:.66rem;
  animation:fadeup .8s ease .2s forwards;
  text-shadow:0 1px 16px rgba(255,244,226,.9);
}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.5rem,6.6vw,5.2rem);line-height:1.02;letter-spacing:-.018em;
  margin:0;max-width:17ch;color:#241608;
  text-shadow:0 2px 34px rgba(255,246,230,.72), 0 1px 3px rgba(255,246,230,.9);
}
h1 .w{display:inline-block;opacity:0;transform:translateY(.36em);
  animation:fadeup .72s cubic-bezier(.2,.8,.3,1) forwards}
h1 .accent{font-style:italic;color:#E32A5B;text-shadow:0 2px 22px rgba(255,240,246,.85), 0 1px 2px rgba(255,246,230,.7)}
@keyframes fadeup{to{opacity:1;transform:none}}

.standfirst{
  margin:clamp(1.4rem,4.5vh,2.6rem) 0 0;max-width:56ch;
  font-size:1.05rem;line-height:1.55;color:#2A1B10;
  opacity:0;animation:fadeup .8s ease 1.55s forwards;
  text-shadow:0 1px 14px rgba(255,246,230,.95);
}

.doors{
  display:flex;flex-wrap:wrap;gap:.85rem;justify-content:center;
  padding:0 var(--gut) clamp(1.1rem,3.4vh,2.2rem);
  opacity:0;animation:fadeup .9s ease 1.85s forwards;
}
.doors .glassbtn{
  font-size:.88rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  padding:1rem 2.1rem;color:#241608;
  background:rgba(255,250,242,.26);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 0 0 1px rgba(255,255,255,.4),
    0 10px 34px rgba(94,54,24,.2);
}
.doors .glassbtn:hover{
  background:rgba(255,252,246,.44);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 0 0 1px rgba(255,255,255,.6),
    0 16px 42px rgba(94,54,24,.26);
}

@media (max-width:640px){
  .doors{gap:.55rem;flex-direction:column;align-items:stretch;max-width:21rem;margin:0 auto}
  .doors .glassbtn{justify-content:center;padding:.9rem 1.4rem}
  .standfirst{font-size:.94rem}
  .plate{object-position:56% 46%}
}
@media (max-height:600px){.standfirst{display:none}}
@media (prefers-reduced-motion:reduce){
  .ken{animation:none}
  .drift{inset:0}
}
</style>
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="drift" id="drift">
    <div class="ken">
      <img class="plate" src="/assets/terrace-a.jpg" alt="">
    </div>
  </div>
</div>

<div class="content">

  <nav class="nav" aria-label="Main">
    <span class="brand"><img src="/assets/agora-mark.png" alt="Agora"></span>
    <div class="pill">
      <a href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>Home</span>
      </a>
      <a href="/research/" aria-current="page">Research</a>
      <a href="/writing/">Writing</a>
    </div>
  </nav>

  <div class="hero">
    <p class="eyebrow">Summer 2026 · Qualitative research</p>
    <h1 id="head"></h1>
    <p class="standfirst">Twenty conversations on how young adults connect socially — and why the bar keeps winning.</p>
  </div>

  <div class="doors">
    <a class="glassbtn" href="/research/presentation/">Presentation</a>
    <a class="glassbtn" href="/research/summary/">Summary</a>
    <a class="glassbtn" href="/research/reports/">Reports</a>
  </div>

</div>

<script>
(function(){
  /* headline, revealed word by word */
  var head = document.getElementById('head');
  var parts = ["More ways to connect than ever.", "Less| connection."];
  var i = 0;
  parts.forEach(function(part, pi){
    part.split(' ').forEach(function(word){
      var accent = word.indexOf('|') > -1;
      var s = document.createElement('span');
      s.className = 'w' + (accent ? ' accent' : '');
      s.textContent = word.replace('|','');
      s.style.animationDelay = (0.4 + i * 0.085) + 's';
      head.appendChild(s);
      head.appendChild(document.createTextNode(' '));
      i++;
    });
    if (pi === 0) head.appendChild(document.createElement('br'));
  });

  /* cursor parallax — a few pixels, no more */
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var drift = document.getElementById('drift');
  var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
  function apply(){
    cx += (tx - cx) * 0.055;
    cy += (ty - cy) * 0.055;
    drift.style.transform = 'translate3d(' + (cx * 16) + 'px,' + (cy * 11) + 'px,0)';
    if (Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) raf = requestAnimationFrame(apply);
    else raf = null;
  }
  window.addEventListener('mousemove', function(e){
    tx = (e.clientX / window.innerWidth - 0.5) * -1;
    ty = (e.clientY / window.innerHeight - 0.5) * -1;
    if (!raf) raf = requestAnimationFrame(apply);
  }, {passive:true});
})();
</script>
</body>
</html>
