<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research — Agora</title>
<meta name="description" content="Twenty conversations on how young adults connect socially — and why the bar keeps winning.">
<link rel="icon" href="/assets/agora-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{height:100%}
body{overflow:hidden}

.stage{
  position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(#BFE9FA 0%, #FCC99C 62%, #F67451 100%);
}
.layer{
  position:absolute;inset:-6%;
  will-change:transform;
  transition:transform .9s cubic-bezier(.18,.7,.28,1);
}
.layer svg{width:100%;height:100%;display:block}

/* ambient drift */
@keyframes drift{
  0%   {transform:translate3d(0,0,0)}
  50%  {transform:translate3d(-2.2%,.7%,0)}
  100% {transform:translate3d(0,0,0)}
}
@keyframes driftslow{
  0%   {transform:translate3d(0,0,0)}
  50%  {transform:translate3d(1.4%,-.5%,0)}
  100% {transform:translate3d(0,0,0)}
}
@keyframes sunrise{
  0%   {transform:translateY(0)}
  50%  {transform:translateY(-1.1%)}
  100% {transform:translateY(0)}
}
.l-sky   .inner{animation:driftslow 54s ease-in-out infinite}
.l-hills .inner{animation:drift 44s ease-in-out infinite}
.l-sun   .inner{animation:sunrise 38s ease-in-out infinite}
.inner{position:absolute;inset:0;will-change:transform}

/* ---------- content ---------- */
.content{
  position:relative;z-index:10;height:100%;
  display:flex;flex-direction:column;
}
.hero{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:1rem var(--gut) 0;text-align:center;
}
.hero .eyebrow{
  color:var(--ink);opacity:0;
  animation:fadeup .7s ease .15s forwards;
  text-shadow:0 1px 14px rgba(255,255,255,.55);
}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.6rem,7.6vw,5.6rem);line-height:.99;letter-spacing:-.022em;
  margin:0;max-width:15ch;color:var(--ink);
  text-shadow:0 2px 30px rgba(255,255,255,.5);
}
h1 .w{
  display:inline-block;opacity:0;
  transform:translateY(.42em);
  animation:fadeup .62s cubic-bezier(.2,.8,.3,1) forwards;
}
h1 .accent{color:var(--white);text-shadow:0 2px 24px rgba(22,22,22,.35)}
@keyframes fadeup{to{opacity:1;transform:none}}

.standfirst{
  margin:1.5rem 0 0;max-width:36ch;
  font-size:1.02rem;line-height:1.5;color:var(--ink);
  opacity:0;animation:fadeup .7s ease 1.5s forwards;
  text-shadow:0 1px 12px rgba(255,255,255,.6);
}

.doors{
  display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;
  padding:0 var(--gut) clamp(2rem,7vh,4.4rem);
  opacity:0;animation:fadeup .8s ease 1.8s forwards;
}
.doors .glassbtn{font-size:1rem}

@media (max-width:640px){
  .doors{gap:.55rem;flex-direction:column;align-items:stretch;max-width:22rem;margin:0 auto}
  .doors .glassbtn{justify-content:space-between}
  .standfirst{font-size:.95rem}
}
@media (max-height:560px){
  .standfirst{display:none}
}
</style>
</head>
<body>

<div class="stage" aria-hidden="true">

  <!-- sky + sun -->
  <div class="layer l-sky" data-depth="4">
    <div class="inner">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ADF1FF"/>
          <stop offset="38%"  stop-color="#D6ECF4"/>
          <stop offset="63%"  stop-color="#FCC99C"/>
          <stop offset="88%"  stop-color="#F79A72"/>
          <stop offset="100%" stop-color="#F67451"/>
        </linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#sky)"/>
      <g fill="#FFFFFF" opacity=".34">
        <ellipse cx="300" cy="170" rx="150" ry="26"/>
        <ellipse cx="420" cy="150" rx="105" ry="19"/>
        <ellipse cx="1240" cy="230" rx="180" ry="28"/>
        <ellipse cx="1090" cy="205" rx="96" ry="17"/>
        <ellipse cx="760" cy="120" rx="120" ry="17"/>
      </g>
    </svg>
    </div>
  </div>

  <div class="layer l-sun" data-depth="7">
    <div class="inner">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="glow">
          <stop offset="0%"   stop-color="#FFF3E2" stop-opacity=".95"/>
          <stop offset="42%"  stop-color="#FCC99C" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#F67451" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="800" cy="640" r="300" fill="url(#glow)"/>
      <circle cx="800" cy="640" r="96" fill="#FFF6EA" opacity=".95"/>
    </svg>
    </div>
  </div>

  <!-- distant land + sea -->
  <div class="layer l-hills" data-depth="13">
    <div class="inner">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <path d="M0 665 L180 618 L330 651 L470 600 L600 645 L720 628 L800 648 L900 622 L1040 655 L1180 608 L1320 648 L1450 625 L1600 660 L1600 700 L0 700 Z"
            fill="#E9A98C" opacity=".62"/>
      <path d="M0 700 L1600 700 L1600 900 L0 900 Z" fill="#F1B392" opacity=".55"/>
      <g fill="#FFF6EA" opacity=".5">
        <rect x="250" y="676" width="180" height="4" rx="2"/>
        <rect x="640" y="700" width="320" height="4" rx="2"/>
        <rect x="1100" y="684" width="210" height="4" rx="2"/>
        <rect x="430" y="730" width="260" height="3" rx="1.5"/>
        <rect x="980" y="748" width="300" height="3" rx="1.5"/>
      </g>
    </svg>
    </div>
  </div>

  <!-- the colonnade -->
  <div class="layer l-arch" data-depth="26">
    <div class="inner">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#EFDFCE"/>
          <stop offset="24%"  stop-color="#FBF3E8"/>
          <stop offset="62%"  stop-color="#F6E9DA"/>
          <stop offset="100%" stop-color="#E2CDB8"/>
        </linearGradient>
        <linearGradient id="stonetop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FBF3E8"/>
          <stop offset="100%" stop-color="#E7D4C1"/>
        </linearGradient>
      </defs>

      <!-- architrave -->
      <rect x="-20" y="-10" width="1640" height="88" fill="url(#stonetop)"/>
      <rect x="-20" y="78" width="1640" height="15" fill="#DCC5AE"/>

      <!-- floor -->
      <rect x="-20" y="852" width="1640" height="60" fill="url(#stonetop)"/>
      <rect x="-20" y="840" width="1640" height="13" fill="#DCC5AE"/>

      <!-- left column -->
      <g>
        <rect x="96" y="93" width="150" height="30" fill="url(#stonetop)"/>
        <rect x="110" y="123" width="122" height="718" fill="url(#stone)"/>
        <g stroke="#DFC9B2" stroke-width="2.4" opacity=".8">
          <line x1="134" y1="128" x2="134" y2="836"/>
          <line x1="158" y1="128" x2="158" y2="836"/>
          <line x1="182" y1="128" x2="182" y2="836"/>
          <line x1="206" y1="128" x2="206" y2="836"/>
        </g>
        <rect x="96" y="818" width="150" height="26" fill="url(#stonetop)"/>
      </g>

      <!-- right column -->
      <g>
        <rect x="1354" y="93" width="150" height="30" fill="url(#stonetop)"/>
        <rect x="1368" y="123" width="122" height="718" fill="url(#stone)"/>
        <g stroke="#DFC9B2" stroke-width="2.4" opacity=".8">
          <line x1="1392" y1="128" x2="1392" y2="836"/>
          <line x1="1416" y1="128" x2="1416" y2="836"/>
          <line x1="1440" y1="128" x2="1440" y2="836"/>
          <line x1="1464" y1="128" x2="1464" y2="836"/>
        </g>
        <rect x="1354" y="818" width="150" height="26" fill="url(#stonetop)"/>
      </g>
    </svg>
    </div>
  </div>
</div>

<div class="content">

  <nav class="nav on-dark" aria-label="Main">
    <div class="navrow">
      <a class="brand" href="/"><img src="/assets/agora-mark.png" alt="Agora"></a>
      <div class="pill">
        <a href="/" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
          <span>Home</span>
        </a>
        <a href="/research/" aria-current="page">Research</a>
        <a href="/writing/">Writing</a>
      </div>
    </div>
    <div class="subnav">
      <a href="/research/presentation/">Presentation</a>
      <a href="/research/summary/">Summary</a>
      <a href="/research/reports/">Reports</a>
    </div>
  </nav>

  <div class="hero">
    <p class="eyebrow">Summer 2026 · Qualitative research</p>
    <h1 id="head"></h1>
    <p class="standfirst">Twenty conversations on how young adults connect socially — and why the bar keeps winning.</p>
  </div>

  <div class="doors">
    <a class="glassbtn" href="/research/presentation/">Presentation <span class="arr">→</span></a>
    <a class="glassbtn" href="/research/summary/">Summary <span class="arr">→</span></a>
    <a class="glassbtn" href="/research/reports/">Reports <span class="arr">→</span></a>
  </div>

</div>

<script>
(function(){
  /* ---- headline, revealed word by word ---- */
  var line = "More ways to connect than ever.|Less connection.";
  var head = document.getElementById('head');
  var parts = line.split('|');
  var i = 0;
  parts.forEach(function(part, pi){
    part.split(' ').forEach(function(word){
      var s = document.createElement('span');
      s.className = 'w' + (pi === 1 ? ' accent' : '');
      s.textContent = word;
      s.style.animationDelay = (0.35 + i * 0.085) + 's';
      head.appendChild(s);
      head.appendChild(document.createTextNode(' '));
      i++;
    });
    if (pi === 0) head.appendChild(document.createElement('br'));
  });

  /* ---- cursor parallax ---- */
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  var layers = [].slice.call(document.querySelectorAll('.layer'));
  var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;

  function apply(){
    cx += (tx - cx) * 0.06;
    cy += (ty - cy) * 0.06;
    layers.forEach(function(l){
      var d = parseFloat(l.getAttribute('data-depth')) || 0;
      l.style.transform = 'translate3d(' + (cx * d) + 'px,' + (cy * d) + 'px,0)';
    });
    if (Math.abs(tx - cx) > 0.01 || Math.abs(ty - cy) > 0.01) raf = requestAnimationFrame(apply);
    else raf = null;
  }
  function onMove(e){
    tx = (e.clientX / window.innerWidth - 0.5) * -1;
    ty = (e.clientY / window.innerHeight - 0.5) * -1;
    if (!raf) raf = requestAnimationFrame(apply);
  }
  window.addEventListener('mousemove', onMove, {passive:true});

  if (window.DeviceOrientationEvent){
    window.addEventListener('deviceorientation', function(e){
      if (e.gamma == null) return;
      tx = Math.max(-1, Math.min(1, e.gamma / 32)) * -1;
      ty = Math.max(-1, Math.min(1, (e.beta - 45) / 32)) * -1;
      if (!raf) raf = requestAnimationFrame(apply);
    }, {passive:true});
  }
})();
</script>
</body>
</html>
