<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{height:100%}
body{
  overflow:hidden;
  background:linear-gradient(165deg,#ADF1FF 0%,#D9EDF3 34%,#FCC99C 76%,#F79A72 100%);
  background-size:100% 180%;
  animation:shift 26s ease-in-out infinite alternate;
}
@keyframes shift{0%{background-position:0 0}100%{background-position:0 100%}}

.content{position:relative;z-index:10;height:100%;display:flex;flex-direction:column}
.mid{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:1rem var(--gut) 4rem;
}
h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(2.6rem,8vw,5rem);line-height:1;letter-spacing:-.022em;
  margin:0 0 1.1rem;max-width:17ch;
  opacity:0;animation:up .75s cubic-bezier(.2,.8,.3,1) .25s forwards;
  text-shadow:0 2px 26px rgba(255,255,255,.5);
}
p.sub{
  margin:0;max-width:34ch;font-size:1.04rem;line-height:1.5;
  opacity:0;animation:up .75s ease .5s forwards;
}
p.when{
  font-family:var(--hand);font-size:1.6rem;color:var(--coral);
  margin:1.6rem 0 0;transform:rotate(-1.4deg);
  opacity:0;animation:up .75s ease .75s forwards;
}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
p.when{animation-name:upr}
@keyframes upr{from{opacity:0;transform:translateY(14px) rotate(-1.4deg)}to{opacity:1;transform:rotate(-1.4deg)}}
</style>
</head>
<body>

<div class="content">

  <nav class="nav" aria-label="Main">
    <span class="brand"><img src="/assets/agora-mark.png" alt="Agora"></span>
    <div class="pill">
      <a href="/" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>Home</span>
      </a>
      <a href="/research/">Research</a>
      <a href="/writing/" aria-current="page">Writing</a>
    </div>
  </nav>

  <div class="mid">
    <h1>My personal thoughts on the research.</h1>
    <p class="sub">What I learned and where we go from here.</p>
    <p class="when">Coming soon.</p>
  </div>

</div>
<script src="/assets/nav.js" defer></script>
</body>
</html>
